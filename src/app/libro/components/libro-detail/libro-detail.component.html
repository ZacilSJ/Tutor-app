<div class="libro-container">
  <div class="libro-imagen">
    <img [src]="libro.imagen" alt="portada">
  </div>

  <div class="libro-info">
    <ul>
      <li>Título: {{ libro.title }}</li>
      <li>Autor: {{ libro.autor }}</li>
    </ul>

    <p>
      <a
        class="e2e-dangerous-url"
        [routerLink]="['/libro', libro.id, 'leer']">
        Click on me to read!
      </a>
    </p>
  </div>
</div>
