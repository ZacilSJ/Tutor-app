<div class="card">
  <div class="header">Reading</div>

  <img
    class="imagen"
    [src]="lectura.imagen"
    alt="lectura"
  />

  <div class="titulo">{{ lectura.title }}</div>

<button 
  class="btn-start"
  [routerLink]="idsBloqueados.includes(lectura.id) ? null : ['/cuestionario', lectura.id]"
  [disabled]="idsBloqueados.includes(lectura.id)">
  
  {{ idsBloqueados.includes(lectura.id) ? 'Locked ' : 'Start' }}

</button>

</div>
